<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>保存到收藏夹</title>
    <link rel="stylesheet" href="./popup/styles.css" />
  </head>
  <body>
    <main>
      <header class="page">
        <h1 id="page-title">正在读取…</h1>
        <p id="page-url"></p>
      </header>

      <section class="ai">
        <p id="status" class="status" role="status" aria-live="polite">
          正在读取页面与收藏夹…
        </p>
        <div id="progress" class="progress-row" hidden>
          <div
            id="progress-bar"
            class="progress"
            role="progressbar"
            aria-label="本地模型下载进度"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <span id="progress-text" class="progress-text" aria-hidden="true"
            >0%</span
          >
        </div>
        <button id="ai-action" type="button" class="ghost" hidden></button>
        <p
          id="ai-quota"
          class="status"
          role="status"
          aria-live="polite"
          hidden
        ></p>
      </section>

      <section class="tree-wrap" aria-labelledby="tree-label">
        <fieldset id="folder-picker">
          <legend id="tree-label" class="section-label">选择收藏位置</legend>
          <ul id="tree" class="tree"></ul>
        </fieldset>
      </section>

      <footer>
        <p id="target" class="target">目标：未选择</p>
        <div class="actions">
          <button id="cancel" type="button">取消</button>
          <button id="save" type="button" disabled>保存</button>
        </div>
      </footer>
    </main>
    <script type="module" src="./popup/main.ts"></script>
  </body>
</html>
